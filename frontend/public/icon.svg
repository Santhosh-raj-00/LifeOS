<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded App Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Shield Glow -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4" />

  <!-- Shield Shape -->
  <path d="M 256 96 C 320 128, 384 120, 384 120 V 264 C 384 344, 304 400, 256 424 C 208 400, 128 344, 128 264 V 120 C 128 120, 192 128, 256 96 Z" 
        fill="#0F172A" 
        fill-opacity="0.8" 
        stroke="#FFFFFF" 
        stroke-opacity="0.2" 
        stroke-width="6" 
        filter="url(#shadow)" />

  <!-- Flame Icon inside Shield -->
  <path d="M 256 160 C 272 192, 296 216, 296 248 C 296 270, 278 288, 256 288 C 234 288, 216 270, 216 248 C 216 220, 236 198, 256 160 Z" 
        fill="url(#flameGrad)" />
  <path d="M 256 220 C 264 236, 274 248, 274 262 C 274 272, 266 280, 256 280 C 246 280, 238 272, 238 262 C 238 248, 248 238, 256 220 Z" 
        fill="#FBBF24" />

  <!-- Checkmark Badge -->
  <circle cx="340" cy="330" r="36" fill="#10B981" stroke="#FFFFFF" stroke-width="4" filter="url(#shadow)" />
  <path d="M 324 330 L 334 340 L 356 318" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
