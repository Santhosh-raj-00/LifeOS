spring.application.name=lifeos-backend
server.port=8085

# Database configuration
# To use MySQL locally, uncomment the lines below (requires a running MySQL server on 3306)
# spring.datasource.url=jdbc:mysql://localhost:3306/lifeos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
# spring.datasource.username=root
# spring.datasource.password=
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Persistent Database configuration (File DB default, supports MySQL env vars when deployed)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/lifeosdb;MODE=MySQL;DATABASE_TO_UPPER=FALSE;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.sql.init.mode=never

# JPA/Hibernate (Preserves tables and user data permanently)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Enable Scheduling
spring.task.scheduling.pool.size=2

# JWT Secret Properties (256-bit hex encoded key)
lifeos.jwt.secret=9a6747f3b890886f4a7c1b52a1ff37aa443818e6e5a40b8bb07cf7c91c3d1f11
lifeos.jwt.expiration=86400000

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.lifeos=INFO
